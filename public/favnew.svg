    <path d="M177 207C353 183 499 121 627 33C751 119 894 178 1076 207" fill="none" stroke="#b5ffcc" stroke-width="5" stroke-linecap="round"/>
    <path d="M165 235C161 469 184 651 280 829C358 971 469 1075 614 1163" fill="none" stroke="#55ef86" stroke-width="4" stroke-linecap="round"/>
