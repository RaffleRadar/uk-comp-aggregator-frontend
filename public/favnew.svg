    <path d="M627 116C505 198 386 246 238 270C230 271 227 278 227 288C219 488 241 638 319 788C385 914 482 1011 617 1102C622 1106 626 1107 631 1104C770 1017 868 917 936 790C1014 646 1035 490 1021 283C1020 275 1016 271 1007 269C858 242 741 193 627 116Z" fill="url(#blackFace)" stroke="#087a38" stroke-width="13" stroke-linejoin="round" filter="url(#innerShadow)"/>
  </g>

